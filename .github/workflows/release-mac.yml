name: Release macOS

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-26 # arm64, default Xcode 26.6
    timeout-minutes: 30
    permissions:
      contents: write # publish the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match the project version
        run: CHECK_ONLY=1 scripts/release-native.sh "$GITHUB_REF_NAME"
      - run: scripts/release-native.check.sh
      - name: Test
        run: xcodebuild test -project CatNotch.xcodeproj -scheme CatNotch -destination 'platform=macOS,arch=arm64'
      # Stages
      # build/release: the legacy -universal-mac.zip (arm64 content), latest-mac.yml
      # and CatNotch.dmg, so installed 1.0.x apps find the Bridge release.
      - name: Build and stage
        run: scripts/release-native.sh "$GITHUB_REF_NAME"
      # Tags are unprefixed (2.0.0). The release is published (not a draft) with
      # notes from the merged PRs; CatNotch.dmg is a stable name for the README's
      # releases/latest/download link.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "CatNotch $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" build/release/CatNotch.dmg build/release/*.zip build/release/latest-mac.yml --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      # Bump the Homebrew cask in the tap repo. Skipped until the tap exists
      # and HOMEBREW_TAP_TOKEN (a token that can push to it) is set.
      - name: Update the Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "No HOMEBREW_TAP_TOKEN, skipping the cask"; exit 0; fi
          VERSION="$GITHUB_REF_NAME"
          SHA=$(shasum -a 256 build/release/CatNotch.dmg | cut -d' ' -f1)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$OWNER/homebrew-desknotch.git" tap
          mkdir -p tap/Casks
          sed -e "s/VERSION/$VERSION/" -e "s/SHA256/$SHA/" -e "s/OWNER/$OWNER/g" packaging/homebrew/desknotch.rb > tap/Casks/desknotch.rb
          cd tap
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Casks/desknotch.rb
          git commit -m "desknotch $VERSION" || exit 0
          git push
